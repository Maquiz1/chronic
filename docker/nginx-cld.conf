# Host nginx site for the DCLD study system (https://chronic.tamris.org).
#
#   cp docker/nginx-cld.conf /etc/nginx/sites-available/chronic.tamris.org
#   ln -s /etc/nginx/sites-available/chronic.tamris.org /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d chronic.tamris.org      # adds the HTTPS server block and the HTTP -> HTTPS redirect
#
# The DNS A record must point to the server before running certbot.

server {
    listen 80;
    server_name chronic.tamris.org;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
    }
}
