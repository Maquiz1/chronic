{% extends 'registration/_auth_base.html' %}
{% block title %}Forgot password{% endblock %}
{% block card %}
<h1 class="h4">Forgot password</h1>
<p class="text-muted small">Enter your email and we will send you a link to choose a new password.</p>
<form method="post">{% csrf_token %}{% include '_form.html' %}<button class="btn btn-primary w-100">Send reset link</button></form>
<p class="small mt-3 mb-0"><a href="{% url 'login' %}">Back to log in</a></p>
{% endblock %}
