{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row"><div class="col-md-7 col-lg-5">
<div class="card"><div class="card-body">
  <h1 class="h4">Change password</h1>
  <form method="post">{% csrf_token %}{% include '_form.html' %}
    <button class="btn btn-primary">Change password</button>
    <a class="btn btn-link" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div></div>
</div></div>
{% endblock %}
